
name: Preparar orden de productos en Pages CMS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rellenar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rellenar fechas de creación
        run: python scripts/rellenar_fechas_cms.py

      - name: Guardar fechas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products/
          if ! git diff --cached --quiet; then
            git commit -m "Añadir orden de creación para Pages CMS"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
