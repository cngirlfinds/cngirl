media:
  input: assets
  output: assets

content:
  - name: products
    label: Productos
    type: collection
    path: data/products
    format: json
    filename: "{year}-{month}-{day}-{hour}-{minute}-{second}-{primary}.json"
    view:
      fields: [name, brand, category, price, reviewed, date]
      primary: name
      sort: [date, name]
      search: [name, brand, category]
      default:
        sort: date
        order: desc
    fields:
      - name: name
        label: Nombre del producto
        type: string
        required: true

      - name: brand
        label: Marca
        type: string
        required: true

      - name: extraBrands
        label: Marcas adicionales (colaboraciones)
        type: string
        list: true
        required: false

      - name: gender
        label: Género
        type: select
        required: false
        options:
          values:
            - value: Hombre
              label: Hombre
            - value: Mujer
              label: Mujer
            - value: Unisex
              label: Unisex

      - name: category
        label: Categoría
        type: select
        required: true
        options:
          values:
            - Camisetas
            - Chaquetas
            - Sudaderas
            - Pantalones
            - Conjuntos
            - Zapatillas
            - Botas y botines
            - Zapatos y tacones
            - Sandalias y chanclas
            - Bolsos
            - Joyería
            - Accesorios
            - Relojes
            - Maletas y equipaje

      - name: price
        label: Precio en euros
        type: number
        required: true

      - name: image
        label: Fotografía
        type: image

      - name: url
        label: Enlace de compra
        type: string
        required: true

      - name: date
        label: Fecha
        type: date

      - name: buyerPhotos
        label: Fotos reales de compradores
        type: image
        list: true

      - name: color
        label: Color
        type: string
        required: false

      - name: reviewed
        label: Revisado
        type: boolean
        required: false
